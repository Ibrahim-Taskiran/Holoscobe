name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Fetch verified tracking models
        shell: pwsh
        run: |
          ./scripts/setup.ps1 -SkipPackages
      - name: Build release
        shell: pwsh
        env:
          HOLOSCOBE_PYTHON: python
        run: ./scripts/release.ps1
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = Get-ChildItem dist/Holoscobe-*-win64.zip | Select-Object -First 1
          gh release create "$env:GITHUB_REF_NAME" $zip.FullName "$($zip.FullName).sha256" --title "Holoscobe $env:GITHUB_REF_NAME" --generate-notes
