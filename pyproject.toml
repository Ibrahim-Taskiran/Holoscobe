[project]
name = "handcontrol"
version = "1.0.0"
requires-python = ">=3.11,<3.12"
# Tested pins (Phase 0, 2026-11-12). Full transitive lock with hashes: requirements.lock.
# opencv-contrib-python (not opencv-python): mediapipe requires it; both share the cv2/ folder.
dependencies = [
    "mediapipe==1.2.2",
    "opencv-contrib-python==5.0.0.93",
    "PySide6-Essentials==6.12.0",
    "pycaw==20260927",
    "comtypes==1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pyinstaller==6.22.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m \"not manual\""
markers = ["manual: needs real hardware or touches the live desktop; skipped by default"]
